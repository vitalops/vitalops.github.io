# Publishes the docs of github.com/vitalops/vitalops (its docs/ folder) at vitalops.ai/oss/.
name: oss docs
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency: oss-docs
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Copy docs/ from vitalops/vitalops
        run: |
          sha=$(git ls-remote https://github.com/vitalops/vitalops refs/heads/main | cut -c1-7)
          echo "SHA=$sha" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/src"
          curl -sfL https://codeload.github.com/vitalops/vitalops/tar.gz/refs/heads/main | tar -xz -C "$RUNNER_TEMP/src" --strip-components=1
          rm -rf oss && cp -r "$RUNNER_TEMP/src/docs" oss
      - name: Commit and publish if changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add -A oss
          if git diff --cached --quiet; then echo "oss/ is up to date"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "oss: docs from vitalops/vitalops@$SHA"
          git push
          curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true
